name: Publish Quantvesting Journal to Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - '_posts/**'
      - 'scripts/build_blog.py'
      - 'web/blog/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantvesting-journal-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Journal build dependencies
        run: python -m pip install --disable-pip-version-check PyYAML mistune

      - name: Build Quantvesting Journal
        run: python scripts/build_blog.py

      - name: Deploy Journal assets to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
